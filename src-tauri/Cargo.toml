[package]
name = "courier"
version = "0.1.0"
description = "Courier - a lightweight, beautiful API client"
authors = ["Nithin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "courier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "default-tls",
  "http2",
  "charset",
  "gzip",
  "deflate",
  "cookies",
  "multipart",
  "form",
] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

# A release profile tuned for a small, fast desktop binary.
# Thin LTO + parallel codegen units keep CI build times reasonable; full LTO
# with codegen-units = 1 serialized the whole dependency graph and cost minutes.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"

