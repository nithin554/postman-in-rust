[package]
name = "courier"
version = "0.1.0"
description = "Courier - a lightweight, beautiful API client"
authors = ["Nithin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "courier_lib"
# Desktop-only build. `staticlib` and `cdylib` exist for Tauri's mobile targets;
# here they only produced two extra LTO links of the whole dependency graph on
# every CI run. Re-add them if iOS/Android support is introduced.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "default-tls",
  "http2",
  "charset",
  "gzip",
  "deflate",
  "cookies",
  "multipart",
  "form",
] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

# A release profile tuned for a small, fast desktop binary.
# LTO is off on purpose: the frontend bundle is embedded into the app crate, so
# the crate is relinked on every CI run, and ThinLTO dominated that relink
# (~117s of a ~140s cargo phase). Without it the relink is a plain COFF link.
[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
strip = true
panic = "abort"

