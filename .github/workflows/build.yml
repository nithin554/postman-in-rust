name: build.yml
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      # Caches ~/.cargo/registry and src-tauri/target. The frontend is not built
      # here: `pnpm tauri build` runs tauri.conf.json's beforeBuildCommand.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Get Tauri cache directory
        id: tauri-cache
        run: |
          # AppendAllText avoids the UTF-8 BOM that PS 5.1 Out-File adds,
          # which would corrupt the value handed to actions/cache.
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "path=$env:LOCALAPPDATA\tauri`n")

      - name: Cache Tauri bundler tools (NSIS/WiX)
        uses: actions/cache@v6
        with:
          path: ${{ steps.tauri-cache.outputs.path }}
          # The bundler toolchain version is pinned by the Tauri CLI in
          # pnpm-lock.yaml, so hash the lockfile to rotate stale caches.
          key: tauri-windows-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            tauri-windows-${{ runner.os }}-

      - name: Build Tauri Windows App
        run: pnpm tauri build

      - name: Upload Tauri Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-build
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/windows/*

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install

      - name: Download Tauri Windows Build
        uses: actions/download-artifact@v8
        with:
          name: tauri-windows-build
          path: release/

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
