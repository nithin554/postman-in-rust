name: build.yml
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      # Caches ~/.cargo/registry and src-tauri/target. The frontend is not built
      # here: `pnpm tauri build` runs tauri.conf.json's beforeBuildCommand.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Get Tauri cache directory
        id: tauri-cache
        run: |
          # AppendAllText avoids the UTF-8 BOM that PS 5.1 Out-File adds,
          # which would corrupt the value handed to actions/cache.
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "path=$env:LOCALAPPDATA\tauri`n")

      - name: Cache Tauri bundler tools (NSIS/WiX)
        uses: actions/cache@v6
        with:
          path: ${{ steps.tauri-cache.outputs.path }}
          # The bundler toolchain version is pinned by the Tauri CLI in
          # pnpm-lock.yaml, so hash the lockfile to rotate stale caches.
          key: tauri-windows-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            tauri-windows-${{ runner.os }}-

      - name: Build Tauri Windows App
        run: pnpm tauri build

      - name: Upload Tauri Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-build
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/windows/*

      - name: Upload Tauri Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: courier-windows-exe
          path: src-tauri/target/release/courier.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install

      - name: Download Tauri Windows Build
        uses: actions/download-artifact@v8
        with:
          name: tauri-windows-build
          path: release/

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nuget:
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows Executable
        uses: actions/download-artifact@v8
        with:
          name: courier-windows-exe
          path: nuget-payload

      - name: Publish NuGet Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          ./scripts/publish-nuget.ps1 `
            -ExePath nuget-payload/courier.exe `
            -Version $env:PACKAGE_VERSION `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKey $env:GITHUB_TOKEN `
            -SkipDuplicate
